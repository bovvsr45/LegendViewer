[package]
name = "legendviewer"
version = "0.1.0"
description = "LegendViewer - a fast, modern, lightweight VNC viewer"
authors = ["kodekorea"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "legendviewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "time", "sync"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
des = "0.8"
cipher = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
parking_lot = "0.12"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
